<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nuestra cita | Nuestro mapa de citas</title>

    <link rel="stylesheet" href="styles.css?v=4">

    <script src="script.js" defer></script>
</head>

<body>

    <main class="container">

        <section class="hero">

            <div class="heart">❤️</div>

            <h1>Nuestra cita</h1>

            <p class="subtitle">
                El mapa ha decidido por nosotros.
            </p>

        </section>


        <section class="category" id="revelacion">

            <div class="category-icon" id="numero-cita">
                ✨
            </div>

            <p id="mensaje-revelacion">
                Descubriendo nuestra cita...
            </p>

            <div id="cuenta-regresiva">
                3
            </div>


            <div id="resultado-cita" style="display: none;">

                <h2 id="titulo-cita"></h2>

                <p id="descripcion-cita"></p>

            </div>

        </section>


        <footer class="footer">

            <a href="entre-semana.html" class="category">
                ← Volver a Entre semana
            </a>

            <a href="índice.html" class="category">
                🏠 Volver al inicio
            </a>

            <p>
                Sin saber qué viene. Juntos para descubrirlo. ❤️
            </p>

        </footer>

    </main>


    <script>

        const parametros =
            new URLSearchParams(window.location.search);

        const numero =
            parametros.get("numero");


        document.getElementById("numero-cita").textContent =
            "#" + numero;


        let contador = 3;

        const cuenta =
            document.getElementById("cuenta-regresiva");

        const mensaje =
            document.getElementById("mensaje-revelacion");

        const resultado =
            document.getElementById("resultado-cita");


        const intervalo =
            setInterval(() => {

                contador--;

                if (contador > 0) {

                    cuenta.textContent =
                        contador;

                } else {

                    clearInterval(intervalo);

                    cuenta.textContent =
                        "❤️";

                    mensaje.textContent =
                        "Esta es nuestra cita...";

                    mostrarCita(numero);

                    resultado.style.display =
                        "block";
                }

            }, 1000);

    </script>

</body>

</html>
