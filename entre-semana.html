<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entre semana | Nuestro mapa de citas</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="container">

        <section class="hero">

            <div class="heart">🌙</div>

            <h1>Entre semana</h1>

            <p class="subtitle">
                Planes cortos, espontáneos y bonitos.
            </p>

        </section>


        <section class="categories">

            <div class="category">
                <div class="category-icon">1</div>

                <h2>Cita #1</h2>

                <p>
                    Aquí descubriremos nuestra primera cita.
                </p>
            </div>


            <div class="category">
                <div class="category-icon">2</div>

                <h2>Cita #2</h2>

                <p>
                    Aquí descubriremos nuestra segunda cita.
                </p>
            </div>


            <div class="category">
                <div class="category-icon">3</div>

                <h2>Cita #3</h2>

                <p>
                    Aquí descubriremos nuestra tercera cita.
                </p>
            </div>


            <div class="category">
                <div class="category-icon">4</div>

                <h2>Cita #4</h2>

                <p>
                    Aquí descubriremos nuestra cuarta cita.
                </p>
            </div>

        </section>


        <footer class="footer">

            <p>Hecho para nosotros ❤️</p>

        </footer>

    </main>

</body>

</html>
